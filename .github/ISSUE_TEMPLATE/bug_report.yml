name: Reporte de error
description: Informa un problema reproducible de YTMusicLite.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: No adjuntes cookies, credenciales ni la carpeta de datos de WebView2.

  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Versión de Windows
      placeholder: Windows 11 23H2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: Escribe una lista breve y exacta.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado actual
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que eliminé información personal, cookies y credenciales.
          required: true
