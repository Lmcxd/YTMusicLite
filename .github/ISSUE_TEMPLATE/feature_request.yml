name: Propuesta de función
description: Sugiere una mejora concreta para YTMusicLite.
title: "[Idea]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema que resolvería
      description: Explica qué resulta difícil o imposible actualmente.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Solución propuesta
      description: Describe el comportamiento deseado.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
